<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arif Fashion House</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="logo.png" onerror="this.style.display='none'">
    <div>
      <b id="brandName">Arif Fashion House</b>
      <small>Men's & Women's Fashion</small>
    </div>
  </div>
  <a class="admin-link" href="admin.html">Admin</a>
</header>

<section class="hero">
  <img src="cover.png" onerror="this.style.display='none'">
  <div>
    <h1 id="heroTitle">Style • Quality • Reliable Service</h1>
    <p>Trendy fashion with home delivery.</p>
  </div>
</section>

<main>
  <div class="section-title">
    <h2>Products</h2>
    <div class="chips">
      <button class="chip active" data-cat="all">All</button>
      <button class="chip" data-cat="men">Men</button>
      <button class="chip" data-cat="women">Women</button>
    </div>
  </div>

  <div id="products" class="grid"></div>
</main>

<div id="checkoutModal" class="modal hidden">
  <div class="modal-card">

    <button class="close" onclick="closeCheckout()">×</button>

    <h2>Confirm Your Order</h2>

    <div class="box" id="summaryBox"></div>

    <div class="box">
      <h3>👤 Customer Information</h3>

      <input id="cName" placeholder="Customer Name *">

      <input id="cPhone"
             placeholder="Mobile Number *"
             inputmode="tel">

      <textarea id="cAddress"
                placeholder="Full Delivery Address *"></textarea>
    </div>

    <div class="box">
      <h3>🚚 Delivery</h3>

      <div class="row">
        <span>Delivery Charge</span>
        <b id="shipCharge">৳0</b>
      </div>
    </div>

    <div class="box">
      <h3>💳 Payment Method</h3>

      <label>
        <input type="radio"
               name="payment"
               value="COD"
               checked>
        Cash on Delivery
      </label>

      <label>
        <input type="radio"
               name="payment"
               value="Advance">
        Advance Payment
      </label>
    </div>

    <div class="box warning">
      <h3>⚠️ Order Confirmation</h3>

      <p id="warningText"></p>

      <label>
        <input type="checkbox"
               id="confirmCheck"
               onchange="toggleConfirm()">

        আমি অর্ডারের তথ্য যাচাই করেছি এবং অর্ডারটি গ্রহণ করব।
      </label>
    </div>

    <button id="confirmBtn"
            class="primary full"
            disabled
            onclick="submitOrder()">
      ✅ Confirm Order
    </button>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
