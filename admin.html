<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Arif Fashion House</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <div>
    <h2>🛍️ Admin Panel</h2>
    <small>Arif Fashion House</small>
  </div>

  <a href="index.html" class="btn">🌐 Store</a>
</header>

<main class="admin-container">

  <!-- WEBSITE SETTINGS -->
  <section class="admin-box">
    <h3>⚙️ Website Settings</h3>

    <label>Brand Name</label>
    <input id="brand" type="text" placeholder="Brand Name">

    <label>Hero Banner Text</label>
    <input id="hero" type="text" placeholder="Banner Text">

    <label>Shipping Charge</label>
    <input id="shipping" type="number" placeholder="Shipping Charge">

    <label>Order Confirmation Warning</label>
    <textarea id="warning" rows="5"></textarea>

    <label class="check-row">
      <input id="codEnabled" type="checkbox">
      Cash on Delivery (COD)
    </label>

    <label class="check-row">
      <input id="advanceEnabled" type="checkbox">
      Advance Payment
    </label>

    <button class="primary-btn" onclick="saveSettings()">
      💾 Save Settings
    </button>
  </section>


  <!-- PRODUCT FORM -->
  <section class="admin-box">

    <h3>📦 Add / Edit Product</h3>

    <input type="hidden" id="productId">

    <label>Product Name</label>
    <input id="productName" type="text" placeholder="Product Name">

    <label>Category</label>
    <select id="productCategory">
      <option value="Men">Men</option>
      <option value="Women">Women</option>
      <option value="Kids">Kids</option>
      <option value="Other">Other</option>
    </select>

    <label>Product Image URL</label>
    <input id="productImage" type="text"
      placeholder="https://example.com/image.jpg">

    <label>Regular Price</label>
    <input id="productPrice" type="number" placeholder="1000">

    <label>Old Price</label>
    <input id="productOldPrice" type="number" placeholder="1200">

    <label>Colors</label>
    <input id="productColors" type="text"
      placeholder="Black, Blue, Red">

    <small>একাধিক color হলে comma দিয়ে লিখুন</small>

    <label>Sizes</label>
    <input id="productSizes" type="text"
      placeholder="S, M, L, XL, XXL">

    <small>Size না থাকলে খালি রাখুন</small>

    <label>YouTube Video Link</label>
    <input id="productYoutube" type="text"
      placeholder="https://youtube.com/watch?v=...">

    <label>Product Description</label>
    <textarea id="productDescription"
      rows="5"
      placeholder="Product details..."></textarea>

    <div class="button-row">

      <button class="primary-btn" onclick="saveProduct()">
        💾 Save Product
      </button>

      <button class="secondary-btn" onclick="clearProductForm()">
        ✖ Clear
      </button>

    </div>

  </section>


  <!-- PRODUCTS -->
  <section class="admin-box">

    <div class="section-title">
      <h3>🛍️ Products</h3>
      <span id="productCount">0 Products</span>
    </div>

    <div id="productsGrid" class="admin-grid"></div>

  </section>


  <!-- ORDERS -->
  <section class="admin-box">

    <div class="section-title">
      <h3>📋 Orders</h3>
      <span id="orderCount">0 Orders</span>
    </div>

    <div id="ordersGrid" class="admin-grid"></div>

  </section>

</main>


<script src="admin.js"></script>

</body>
</html>
